name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # hearth needs GTK 4.16+; Ubuntu's runners ship older GTK, Arch has current.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git gtk4 sqlite rust rust-src
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
